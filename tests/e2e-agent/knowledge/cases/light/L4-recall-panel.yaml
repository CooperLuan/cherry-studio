# Spec: ../../light-medium.md §3 L4
id: kb-l4-recall-panel
title: 召回面板渲染 + 提交门控
tier: light
domain: knowledge
locale: zh-CN
live: []                       # 刻意停在 IPC 搜索之前，纯本地状态
prereqs: [completed-base]

steps:
  # ── 自导航前置：goto knowledge + 打开 golden 库 E2E_Test_KB（completed-base 详情页）──
  - do: goto
    nav: knowledge
  - do: click
    by: { testid: kb-base-row, has-text: "E2E_Test_KB" }

  - intent: 点 DetailHeader 召回测试按钮 → PageSidePanel 抽屉（非 tab）
    do: click
    by: { i18n: knowledge.tabs.recall_test }

  - check: visible
    by: { i18n: knowledge.recall.empty_title }
  - check: visible
    by: { placeholder-i18n: knowledge.recall.placeholder }     # 搜索框 placeholder

  - intent: 空输入 → 提交禁用
    check: disabled
    by: { i18n: knowledge.recall.submit }
  - intent: 纯空格 → 仍禁用
    do: type
    by: { placeholder-i18n: knowledge.recall.placeholder }
    text: "   "
  - check: disabled
    by: { i18n: knowledge.recall.submit }

  - intent: 输入非空 → 提交启用
    do: type
    by: { placeholder-i18n: knowledge.recall.placeholder }
    text: "knowledge base"
  - check: enabled
    by: { i18n: knowledge.recall.submit }
