# Spec: ../../light-medium.md §3 L3
id: kb-l3-index-chunks
title: 索引到 completed + 看分块
tier: light
domain: knowledge
locale: zh-CN
live: [embedding-key]
prereqs: [golden-profile]
fixtures: [sample-md]
after: kb-l2-add-file          # 复用 L2 加入的文件 item

steps:
  - intent: 有界轮询 item 状态到 completed（locale 无关 data-*）
    check: attr
    by: { testid: kb-item-row }
    attr: data-status
    equals: completed
    timeout: 120s

  # 上游 #16442 删了 per-row More 按钮，行操作改为整行右键原生菜单（agent-browser 驱不动）；
  # 但 completed 行本身可点（onClick=open chunks，aria-label=…table.view_chunks_row）→ 直接点行。
  - intent: 点击 completed 行直接打开 chunks 抽屉
    do: click
    by: { attr: { data-status: completed }, testid: kb-item-row }

  - check: visible
    by: { testid: kb-chunk-panel }
  - check: visible
    by: { testid: kb-chunks-count }
  - intent: 至少 1 个分块卡（精确数不断言）
    check: count
    by: { testid: kb-chunk-card }
    min: 1
