# Tracer case — proves the schema for: native OS picker via the `shell`/osascript
# escape hatch (agent-browser can't drive native dialogs), plus a count assertion.
# Spec: ../../light-medium.md §3 L2（决策 B）
id: kb-l2-add-file
title: 加单个文件源（native picker via osascript）
tier: light
domain: knowledge
locale: zh-CN
live: []                       # add-time only; indexing asserted in L3
prereqs: [golden-profile, completed-base]
fixtures: [sample-md]

steps:
  # ── 自导航前置：goto knowledge + 打开 golden 库 E2E_Test_KB（completed-base 详情页，链头）──
  # 不补则 formal runner 从 step0 重放仍停在主聊天页，找不到 DataSourcePanel toolbar（点 kb-base-row=onSelectBase，幂等）。
  - do: goto
    nav: knowledge
  - do: click
    by: { testid: kb-base-row, has-text: "E2E_Test_KB" }

  - intent: 打开数据源菜单（toolbar Add）
    do: click
    by: { i18n: knowledge.data_source.toolbar.add }            # DataSourcePanelHeader → 源类型菜单

  - intent: 选 file 源 → 立即弹原生 OS 文件框
    do: click
    by: { role: menuitem, i18n: knowledge.data_source.add_dialog.sources.file }

  # ── OS 级逃生口：agent-browser 驱动不了原生框 → osascript ──
  # pick-file 内部：Cmd+Shift+G → 输绝对路径 → Enter（避按列表点选的 locale/焦点脆性）
  - intent: 用 osascript 在原生「打开」框喂入 fixture 绝对路径
    do: shell
    osascript: pick-file
    path: "${fixtures.sample-md}"

  # ── 纯 DOM gate：sample.md 行出现（picker 交互非 gating，只看结果）──
  # E2E_Test_KB 已有 1 条 golden 物料 → 裸 `min:1` 会 vacuous 通过（不证明真加了）；按文件名收窄到新增行。
  - check: count
    by: { testid: kb-item-row, has-text: "sample" }
    min: 1
