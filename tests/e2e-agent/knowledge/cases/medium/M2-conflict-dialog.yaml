# Spec: ../../light-medium.md §4 M2
# Covers the keep_all (coexist) resolution. Variants — replace → 1 row, cancel → no change
# — re-trigger the same conflict and assert count=1 / unchanged respectively.
id: kb-m2-conflict-dialog
title: 同名冲突对话框（全部保留 / 替换 / 取消）
tier: medium
domain: knowledge
locale: zh-CN
live: []                       # add-time / dialog；不等重嵌入
prereqs: [completed-base]
fixtures: [dupe-a, dupe-b]

steps:
  - intent: 加入 dupe/a/report.md
    do: click
    by: { i18n: knowledge.data_source.toolbar.add }
  - do: click
    by: { role: menuitem, i18n: knowledge.data_source.add_dialog.sources.file }
  - do: shell
    osascript: pick-file
    path: "${fixtures.dupe-a}"
  - check: count
    by: { testid: kb-item-row, has-text: "report.md" }
    min: 1

  - intent: 再加同 basename 的 dupe/b/report.md → 触发冲突对话框
    do: click
    by: { i18n: knowledge.data_source.toolbar.add }
  - do: click
    by: { role: menuitem, i18n: knowledge.data_source.add_dialog.sources.file }
  - do: shell
    osascript: pick-file
    path: "${fixtures.dupe-b}"

  - check: visible
    by: { i18n: knowledge.data_source.add_dialog.conflict_dialog.title }
  - intent: 三操作按钮在场（全部保留 / 替换 / 取消）
    check: visible
    by: { i18n: knowledge.data_source.add_dialog.conflict_dialog.keep_all }
  - check: visible
    by: { i18n: knowledge.data_source.add_dialog.conflict_dialog.replace }
  - check: visible
    by: { i18n: common.cancel }

  - intent: 「全部保留」→ 两条同名 report 数据源共存
    do: click
    by: { i18n: knowledge.data_source.add_dialog.conflict_dialog.keep_all }
  - check: count
    by: { testid: kb-item-row, has-text: "report" }
    min: 2
