# Spec: ../../light-medium.md §4 M7 — 全确定性（本地 DB/state），无网络
# 排除到 full：删库/删组级联 ConfirmDialog、移回 Ungrouped、drag-resize
id: kb-m7-navigator-mgmt
title: navigator 分组 / 移库 / 重命名 / 搜索
tier: medium
domain: knowledge
locale: zh-CN
live: []
prereqs: [completed-base, no-existing-group]

steps:
  # ── 建组（空名门控 + 有效名）──
  - intent: navigator header Add → 新建分组
    do: click
    by: { aria: Add }
  - do: click
    by: { role: menuitem, i18n: knowledge.groups.add }
  - intent: 空名提交 → 报错
    do: click
    by: { submit: dialog }
  - check: visible
    by: { i18n: knowledge.groups.name_required }
  - do: type
    by: { id: knowledge-entity-name }
    text: "e2e-group"
  - do: click
    by: { submit: dialog }
  - intent: 新 accordion 分组出现
    check: visible
    by: { role: button, has-text: "e2e-group" }

  # ── 移库入组 ──
  - intent: 库行 hover 露出 more 菜单
    do: hover
    by: { testid: kb-base-row }
    skip-if-absent: kb-base-row     # 无 testid 时 fallback 走库行标题
  - do: click
    by: { aria-i18n: common.more }
  - do: click
    by: { role: menuitem, i18n: knowledge.context.move_to }
  - intent: 选目标组 → 库行 re-render 到该 section
    do: click
    by: { within: { i18n: knowledge.context.move_to }, has-text: "e2e-group" }

  # ── 重命名库（h1 更新）──
  - do: click
    by: { aria-i18n: common.more }
  - do: click
    by: { role: menuitem, i18n: knowledge.context.rename }
  - do: type
    by: { id: knowledge-entity-name }
    text: "e2e-renamed-kb"
  - do: click
    by: { submit: dialog }
  - intent: DetailHeader h1 文案更新
    check: visible
    by: { role: heading, has-text: "e2e-renamed-kb" }

  # ── navigator 搜索 + 空态 + clear 恢复 ──
  - do: type
    by: { aria-i18n: knowledge.search }
    text: "zzz-no-match-zzz"
  - check: visible
    by: { i18n: knowledge.empty }
  - intent: clear 按钮（仅非空时显）→ 恢复列表
    do: click
    by: { aria-i18n: common.clear }
  - check: hidden
    by: { i18n: knowledge.empty }
  - check: visible
    by: { role: heading, has-text: "e2e-renamed-kb" }
