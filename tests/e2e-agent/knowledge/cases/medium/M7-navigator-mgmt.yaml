# Spec: ../../light-medium.md §4 M7 — 全确定性（本地 DB/state），无网络
# 排除到 full：删库/删组级联 ConfirmDialog、移回 Ungrouped、drag-resize
# 锚点说明：库行无 testid，用 Tailwind class `group/kb` + 库名 has-text 定位；
#           组用 `group/grp` + 组名。`common.more` 必须 within 库行内（库行/组行同名）。
id: kb-m7-navigator-mgmt
title: navigator 分组/库管理
tier: medium
domain: knowledge
locale: zh-CN
live: []
prereqs: [completed-base, no-existing-group]

steps:
  # ── 建组（空名门控 + 有效名）──
  - intent: 建组：navigator header Add
    do: click
    by: { aria: Add }
  - do: click
    by: { role: menuitem, i18n: knowledge.groups.add }
  - check: visible
    by: { id: knowledge-entity-name }
  - intent: 空名 error
    do: click
    by: { submit: dialog }
  - check: visible
    by: { i18n: knowledge.groups.name_required }
  - do: type
    by: { id: knowledge-entity-name }
    text: "e2e-group"
  - do: click
    by: { submit: dialog }
  - check: visible
    by: { has-text: "e2e-group" }

  # ── 移库入组 ──
  - intent: hover 库行显示 more
    do: hover
    by: { class: "group/kb", has-text: "E2E Light KB" }
  - do: click
    by: { within: { class: "group/kb", has-text: "E2E Light KB" }, aria-i18n: common.more }
  - do: click
    by: { role: menuitem, i18n: knowledge.context.move_to }
  - do: click
    by: { within: { i18n: knowledge.context.move_to }, has-text: "e2e-group" }
  - intent: 展开目标分组，确保库行渲染可见
    do: click
    by: { within: { class: "group/grp", has-text: "e2e-group" }, data-slot: accordion-trigger }
  - check: visible
    by: { within: { has-text: "e2e-group" }, has-text: "E2E Light KB" }

  # ── 重命名库（h1 更新）──
  - do: hover
    by: { class: "group/kb", has-text: "E2E Light KB" }
  - do: click
    by: { within: { class: "group/kb", has-text: "E2E Light KB" }, aria-i18n: common.more }
  - do: click
    by: { role: menuitem, i18n: knowledge.context.rename }
  - do: type
    by: { id: knowledge-entity-name }
    text: "E2E Light KB Renamed"
  - do: click
    by: { submit: dialog }
  - check: visible
    by: { class: "text-2xl", has-text: "E2E Light KB Renamed" }

  # ── navigator 搜索 + 空态 + clear 恢复 ──
  - do: type
    by: { placeholder-i18n: knowledge.search }
    text: "no-match-e2e"
  - check: visible
    by: { i18n: knowledge.empty }
  - do: click
    by: { aria-i18n: common.clear }
  - check: visible
    by: { class: "group/kb", has-text: "E2E Light KB Renamed" }
