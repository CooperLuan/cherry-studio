# Spec: ../../light-medium.md §4 M4 — pure conditional render, no network
id: kb-m4-rag-retrieval
title: RAG 检索条件字段显隐
tier: medium
domain: knowledge
locale: zh-CN
live: []
prereqs: [completed-base]      # rerank 子步 skip-if-absent

steps:
  # ── 自导航前置：goto knowledge + 打开 golden 库 E2E_Test_KB ──
  - do: goto
    nav: knowledge
  - do: click
    by: { testid: kb-base-row, has-text: "E2E_Test_KB" }

  - do: click
    by: { aria-i18n: knowledge.tabs.rag_config }
  - intent: documentCount slider 恒显
    check: visible
    by: { aria-i18n: knowledge.rag.document_count }

  - intent: searchMode=vector → threshold 显, hybrid_alpha 隐
    do: select
    by: { id: kb-rag-search-mode }           # field-i18n 无从关联 → 用 KB-local id（§2A），SelectTrigger 同 ws-l4 套路
    option: vector
  - check: visible
    by: { aria-i18n: knowledge.rag.threshold }
  - check: hidden
    by: { aria-i18n: knowledge.rag.hybrid_alpha }

  - intent: searchMode=hybrid → hybrid_alpha 显, threshold 隐（无 rerank）
    do: select
    by: { id: kb-rag-search-mode }           # field-i18n 无从关联 → 用 KB-local id（§2A），SelectTrigger 同 ws-l4 套路
    option: hybrid
  - check: visible
    by: { aria-i18n: knowledge.rag.hybrid_alpha }
  - check: hidden
    by: { aria-i18n: knowledge.rag.threshold }

  - intent: searchMode=bm25 + 无 rerank → threshold 隐
    do: select
    by: { id: kb-rag-search-mode }           # field-i18n 无从关联 → 用 KB-local id（§2A），SelectTrigger 同 ws-l4 套路
    option: bm25
  - check: hidden
    by: { aria-i18n: knowledge.rag.threshold }

  - intent: 选 rerank 模型 → threshold 重现（rerankModelId!==null）
    do: pick-model
    by: { aria-i18n: knowledge.rag.rerank_model }
    model: "${secrets.rerankModelId}"
    skip-if-absent: secrets.rerankModelId
  - check: visible
    by: { aria-i18n: knowledge.rag.threshold }
    skip-if-absent: secrets.rerankModelId
