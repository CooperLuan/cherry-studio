# Blacklist save-time validation: invalid entry → error Alert; valid → persists.
# Validation runs on Save click (not on input). Save button only mounts while dirty,
# so it vanishing after a valid save is the deterministic "persisted" signal.
# Invalid sample "/(/" → RegExp("(") throws → invalidEntries. Valid = tooltip's own example.
# Spec: ../../light-medium.md §2 WS-M4
id: ws-m4-blacklist-validation
title: blacklist 非法校验 + 合法保存
tier: medium
domain: websearch
locale: zh-CN
live: []
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: settings
  - do: click
    by: { i18n: settings.tool.websearch.title }

  # ── 非法条目 → save → 错误 Alert 出现，未持久化 ──
  - do: type
    by: { placeholder-i18n: settings.tool.websearch.blacklist_tooltip }
    text: "/(/"
  - do: click
    by: { i18n: common.save }
  - check: visible
    by: { role: alert }
  - intent: 非法未保存 → save 按钮仍在（input 仍 dirty）
    check: visible
    by: { i18n: common.save }

  # ── 合法条目 → save → Alert 消失 + save 按钮消失（已持久化）──
  - do: type
    by: { placeholder-i18n: settings.tool.websearch.blacklist_tooltip }
    text: "*://*.example.com/*"
  - do: click
    by: { i18n: common.save }
  - check: hidden
    by: { role: alert }
  - check: hidden
    by: { i18n: common.save }
