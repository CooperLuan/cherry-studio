# Searxng basic-auth: password field is conditionally rendered iff username non-empty.
# Clearing username MUST be a real keyboard clear (controlled input restores on fill "");
# runner implements `type text:""` as focus+select-all+Backspace (see spec §WS-M3).
# Spec: ../../light-medium.md §2 WS-M3
id: ws-m3-searxng-basic-auth
title: searxng basic auth 条件显隐
tier: medium
domain: websearch
locale: zh-CN
live: []
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: settings
  - do: click
    by: { i18n: settings.tool.websearch.title }

  # ── 进 searxng 面板（preset name = 'Searxng'，单能力唯一菜单项）──
  - do: click
    by: { has-attr: data-slot=menu-item, has-text: "Searxng" }

  # ── 基线归一：清空 username → password 框不在 DOM ──
  - do: type
    by: { id: websearch-basic-auth-username }
    text: ""
  - check: hidden
    by: { id: websearch-basic-auth-password }

  # ── 填 username → password 框出现 ──
  - do: type
    by: { id: websearch-basic-auth-username }
    text: "e2e-user"
  - check: visible
    by: { id: websearch-basic-auth-password }

  # ── 真实键盘清空 username → password 框消失（净零）──
  - intent: 连续 Backspace 清空 username（受控 input，禁用 fill ""）
    do: type
    by: { id: websearch-basic-auth-username }
    text: ""
  - check: hidden
    by: { id: websearch-basic-auth-password }
