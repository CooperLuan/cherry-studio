# Provider sub-panel: set-as-default button toggles enabled→disabled + text.
# tavily = single keyword-capability → its left menu item is unique (no within: needed).
# Leaves tavily as keywords default (M2-M5 don't depend on it).
# Spec: ../../light-medium.md §2 WS-M1
id: ws-m1-set-default-button
title: provider set-as-default 按钮态
tier: medium
domain: websearch
locale: zh-CN
live: []
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: settings
  - do: click
    by: { i18n: settings.tool.websearch.title }

  # ── 进 tavily 面板（非默认时按钮 = 「设为默认」、可点）──
  - do: click
    by: { has-attr: data-slot=menu-item, has-text: "Tavily" }
  - check: visible
    by: { i18n: settings.tool.websearch.set_as_default }
  - check: enabled
    by: { i18n: settings.tool.websearch.set_as_default }

  # ── 点击设为默认 → 文案「默认搜索」+ 禁用 ──
  - do: click
    by: { i18n: settings.tool.websearch.set_as_default }
  - check: visible
    by: { i18n: settings.tool.websearch.is_default }
  - check: disabled
    by: { i18n: settings.tool.websearch.is_default }
