# Default keywords-provider switch → badge migrates; fetch default (jina) unaffected.
# Reset to exa-mcp at end: required so WS-M1 sees tavily non-default (run-order safety).
# Spec: ../../light-medium.md §2 WS-L4
id: ws-l4-switch-default-provider
title: 切换默认搜索 provider → Badge 迁移
tier: light
domain: websearch
locale: zh-CN
live: []
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: settings
  - do: click
    by: { i18n: settings.tool.websearch.title }

  # ── keywords 默认 exa-mcp → tavily（select 按内部 provider id）──
  - do: select
    by: { id: web-search-default-keywords-provider }
    option: tavily
  - check: visible
    by: { testid: ws-default-badge, attr: { data-provider-id: tavily } }
  - check: hidden
    by: { testid: ws-default-badge, attr: { data-provider-id: exa-mcp } }
  - intent: fetch 默认 jina 不受 keywords 切换影响（独立）
    check: visible
    by: { testid: ws-default-badge, attr: { data-provider-id: jina } }

  # ── 复位 keywords → exa-mcp（run-order 必须 + 幂等）──
  - do: select
    by: { id: web-search-default-keywords-provider }
    option: ExaMCP                                            # radix SelectItem 不把 value 暴露成可查 DOM 属性 → runner 按可见文本匹配；显示名=provider.name='ExaMCP'（裸 'exa-mcp' 因连字符匹配不上）。badge 仍按内部 id data-provider-id=exa-mcp
  - check: visible
    by: { testid: ws-default-badge, attr: { data-provider-id: exa-mcp } }
