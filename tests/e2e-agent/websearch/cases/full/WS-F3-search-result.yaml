# Spec: ../../full.md §2 WS-F3 — 网络搜索真的跑完并返回结果（full·live·agentic）
# 比 WS-F1 更进一步：WS-F1 断「工具被调」(message-tool-history)；本例断「搜索真完成且有结果」
#   = MessageWebSearch 结果块渲染（data-testid=message-websearch-result，仅 status='done' 且结果数>0 时挂载）。
# ⚠️ live 校准（2026-06-29 ws-f3-rerun）纠正：结果块【嵌在 process-history 折叠组内】，折叠收起时不在 DOM。
#   故流程 = 先等 message-tool-history 出现（~37s）→ 点开折叠 → 再 poll 结果块（搜索完成时挂载）。
#   实测：工具 36.9s 出现(count=2)，展开后结果块 data-result-count=5（「5 个搜索结果」）。
# 红线：只断结果块在场（=搜索完成有结果，结构信号）；不断结果内容/排序/质量，data-result-count 不硬断 ≥N。
# golden：E2E_WebSearch_Test_Assistant 已 enableWebSearch=true（同 WS-F1）。
id: ws-f3-search-result
title: 网络搜索真的跑完并返回结果（结果块信封）
tier: full
domain: websearch
locale: zh-CN
live: [llm, websearch]
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: assistants
  - intent: 底部 picker 选网搜专用 assistant
    do: click
    by: { data-slot: popover-trigger }
  - do: click
    by: { role: option, has-text: "E2E_WebSearch_Test_Assistant" }
  - intent: 在 Tiptap 输入带具体主题的 forcing prompt（同 WS-F1）
    do: type
    by: { has-attr: contenteditable }
    text: "用网络搜索查一下 2026 年 6 月 OpenAI 有哪些新发布，并给出来源链接。"
  - do: click
    by: { aria-i18n: chat.input.send }
  - intent: 先等工具调用折叠组出现（=≥1 工具被调，live 首个 ~37s）
    check: visible
    by: { testid: message-tool-history }
    timeout: 180s
  - intent: 点开 process-history 折叠（结果块嵌在其内，收起时不在 DOM）
    do: click
    by: { testid: message-tool-history }
  - intent: 在展开的折叠内 poll 结果块（搜索 status=done 且有结果时才挂载）
    check: visible
    by: { testid: message-websearch-result }
    timeout: 240s
