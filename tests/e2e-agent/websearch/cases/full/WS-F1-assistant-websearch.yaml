# Spec: ../../full.md §2 WS-F1 — assistant 真的调用 web_search（full·live·agentic）
# 红线：只断「工具触发的信封」——process-history 折叠组存在 = ≥1 工具被调；
#       不断搜索结果内容/排序/质量/生成文本。
# 信封 = [data-testid=message-tool-history]（MessagePartsRenderer 折叠组，≥1 工具才渲染）。
#       collapse-content-* 的 suffix 是动态调用 ID（如 call_xxx），不可作锚。
# golden：E2E_WebSearch_Test_Assistant 已 enableWebSearch=true（2026-06-27 bake）。
# 实测（full-envelope-cal）：process-history 9 个工具调用（7 search + 2 web_fetch），~70s。
# gate 二义：信封缺失 = 模型没调（capability，记录）/ 工具坏（任何模型，才修）→ full 非 gating。
id: ws-f1-assistant-websearch
title: assistant 真的用网络搜索（agentic 信封）
tier: full
domain: websearch
locale: zh-CN
live: [llm, websearch]
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: assistants
  - intent: 底部 picker 选网搜专用 assistant
    do: click
    by: { data-slot: popover-trigger }
  - do: click
    by: { role: option, has-text: "E2E_WebSearch_Test_Assistant" }
  - intent: 在 Tiptap 输入带具体主题的 forcing prompt（去掉模型反问的口子）
    do: type
    by: { has-attr: contenteditable }
    text: "用网络搜索查一下 2026 年 6 月 OpenAI 有哪些新发布，并给出来源链接。"
  - do: click
    by: { aria-i18n: chat.input.send }
  - intent: 等并断言工具调用信封（live LLM+网搜，首个工具调用可能 ~70s）
    check: visible
    by: { testid: message-tool-history }
    timeout: 180s
