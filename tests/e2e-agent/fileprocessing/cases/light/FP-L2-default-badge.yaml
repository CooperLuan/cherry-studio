# Default-engine badges (golden: doc=mineru / image=paddleocr) via locale-free
# data-feature + data-processor-id; panel badge replaces the set-as-default button.
# Spec: ../../light-medium.md §2 FP-L2
id: fp-l2-default-badge
title: 默认引擎 Badge 校验
tier: light
domain: fileprocessing
locale: zh-CN
live: []
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: settings
  - do: click
    by: { i18n: settings.tool.file_processing.title }

  # ── 菜单默认 Badge：文档=mineru / 图片=paddleocr（locale 无关 data-*）──
  - intent: 文档默认 mineru 挂默认 Badge
    check: visible
    by: { testid: fp-menu-default-badge, attr: { data-feature: document_to_markdown, data-processor-id: mineru } }
  - intent: 图片默认 paddleocr 挂默认 Badge
    check: visible
    by: { testid: fp-menu-default-badge, attr: { data-feature: image_to_text, data-processor-id: paddleocr } }

  # ── 选中 mineru → 面板默认 Badge + 无「设为默认」按钮 ──
  - do: click
    by: { id: fp-item-document_to_markdown-mineru }
  - check: visible
    by: { testid: fp-panel-default-badge, attr: { data-processor-id: mineru } }
  - check: hidden
    by: { i18n: settings.tool.file_processing.actions.set_as_default }
