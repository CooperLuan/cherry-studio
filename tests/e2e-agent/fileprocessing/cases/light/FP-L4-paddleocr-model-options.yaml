# PaddleOCR parse-model select offers feature-specific option sets (image=PP-OCRv* /
# document=PaddleOCR-VL*+PP-StructureV3). Two paddleocr entries disambiguated by id.
# Spec: ../../light-medium.md §2 FP-L4
id: fp-l4-paddleocr-model-options
title: PaddleOCR 解析模型选项随 feature 切换
tier: light
domain: fileprocessing
locale: zh-CN
live: []
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: settings
  - do: click
    by: { i18n: settings.tool.file_processing.title }

  # ── 图片 paddleocr → 打开解析模型 Select → PP-OCRv6 / PP-OCRv5 ──
  - do: click
    by: { id: fp-item-image_to_text-paddleocr }
  - do: click
    by: { aria-i18n: settings.tool.file_processing.processors.paddleocr.fields.parse_model }
  - check: visible
    by: { role: option, has-text: "PP-OCRv6" }
  - check: visible
    by: { role: option, has-text: "PP-OCRv5" }
  - do: press
    keys: Escape

  # ── 文档 paddleocr → 打开 → PaddleOCR-VL-1.5 / PP-StructureV3 ──
  - do: click
    by: { id: fp-item-document_to_markdown-paddleocr }
  - do: click
    by: { aria-i18n: settings.tool.file_processing.processors.paddleocr.fields.parse_model }
  - check: visible
    by: { role: option, has-text: "PaddleOCR-VL-1.5" }
  - check: visible
    by: { role: option, has-text: "PP-StructureV3" }
  - do: press
    keys: Escape
