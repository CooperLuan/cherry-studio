# API key list dialog: real live CRUD (add → row +1, delete → empty), enabled by #16494
# (`fix(file-processing): refresh API key list after edits`). The dialog now reflects
# add/delete immediately — no close→reopen — so we assert real fp-apikey-row counts.
# Isolation: use `mistral` (no golden key → starts empty) so we never touch golden's
# configured keys (paddleocr/mineru/doc2x). Net-zero: the added key is deleted at the end.
# Spec: ../../light-medium.md §2 FP-M2
id: fp-m2-apikey-dialog
title: API key 列表对话框 · 真 live CRUD（add/delete 即时反映）
tier: medium
domain: fileprocessing
locale: zh-CN
live: []
prereqs: [golden-profile]
fixtures: []

steps:
  - do: goto
    nav: settings
  - do: click
    by: { i18n: settings.tool.file_processing.title }

  # ── 进 mistral 面板（golden 无 key → 空列表，隔离不破坏既有 key）→ 打开 API 密钥管理 ──
  - do: click
    by: { id: fp-item-document_to_markdown-mistral }
  - do: click
    by: { aria-i18n: settings.provider.api.key.list.open }
  - check: visible
    by: { i18n: settings.provider.api.key.list.title }
  - intent: 初始空列表（空态文案在场）
    check: visible
    by: { i18n: error.no_api_key }

  # ── 新增并保存一个 key → 列表立即 +1（#16494：保存后行不再消失）──
  - do: click
    by: { i18n: common.add }
  - do: type
    by: { placeholder-i18n: settings.provider.api.key.new_key.placeholder }
    text: "e2e-fake-key-001"
  - do: click
    by: { aria-i18n: common.save }
  - intent: 保存后 live +1（saved 行，编辑 input 消失）
    check: count
    by: { testid: fp-apikey-row }
    equals: 1
  - check: hidden
    by: { placeholder-i18n: settings.provider.api.key.new_key.placeholder }

  # ── 删除该 key → 列表立即归零（#16494：删除后行不再残留）→ 净零 ──
  - do: click
    by: { within: { testid: fp-apikey-row }, aria-i18n: common.delete }
  - intent: 确认删除（window.modal.confirm）
    do: click
    by: { i18n: common.confirm }
  - intent: 删除后 live 归零（回空态，golden mistral 仍无 key）
    check: visible
    by: { i18n: error.no_api_key }
